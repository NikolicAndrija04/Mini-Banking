server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**

            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**

            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**

            - id: card-service
              uri: lb://card-service
              predicates:
                - Path=/api/cards/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: ${JWT_SECRET:MiniBankingSuperSecretKeyThatMustBeAtLeast32CharactersLong123}
  expiration: 3600