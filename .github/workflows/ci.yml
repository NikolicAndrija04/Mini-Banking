name: Maven verification

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java 21 reactor and Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker daemon
        run: docker info

      - name: Run complete Maven reactor
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp \
            -Daether.connector.connectTimeout=30000 \
            -Daether.connector.requestTimeout=120000 \
            test

